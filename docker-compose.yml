services:
  # Open-source HTTP reverse proxy and load balancer designed for cloud-native infrastructure.
  traefik:
    image: 'traefik:v3.7.14' # Use a specific, stable version for reliability.
    container_name: 'traefik'
    security_opt:
      - 'no-new-privileges:true' # Hardening: no setuid/setgid elevation.
    deploy:
      resources:
        limits:
          memory: 256M # Traefik is efficient; 256MB is plenty.
    env_file:
      - path: .env
        required: false
    volumes:
      - ${ROOT_PATH:-.}/tools/traefik:/etc/traefik # Mount config directory (GitOps ready).
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access for service discovery.
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - iv0ks-dev
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dashboard.tls.certresolver=namecheap'
      - 'traefik.http.routers.dashboard.tls.domains[0].main=*.iv0ks.dev'
      - 'traefik.http.routers.dashboard.tls.domains[0].sans=iv0ks.dev'
      - 'traefik.http.routers.dashboard.service=api@internal'
      - 'traefik.http.routers.dashboard.rule=Host(`traefik.iv0ks.dev`)'
      - 'traefik.http.routers.dashboard.entrypoints=websecure'
      - 'traefik.http.routers.dashboard.tls=true'

  # Lab's database. The app waits for this to be *healthy* (not just started) before it migrates and seeds,
  # so there is no startup race: `docker compose up -d` brings the whole lab up in one command.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirrorbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirrorbox}
      POSTGRES_DB: ${POSTGRES_DB:-mirrorbox}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # pg_isready returns 0 only once Postgres is accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mirrorbox} -d ${POSTGRES_DB:-mirrorbox}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iv0ks-dev

  # mirrorbox — the intentionally vulnerable case-records vault (capstone read
  # IDOR exposed under four id formats at once, CWE-639). The entrypoint
  # migrates + seeds, then starts the Next.js server.
  mirrorbox:
    image: ghcr.io/iv0ks/mirrorbox:latest
    build:
      context: .
      args:
        FLAG: ${FLAG:-FLAG{MIRRORBOX_SAME_BUG_EVERY_DISGUISE}}
    container_name: mirrorbox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - '3000:3000'
    networks:
      - iv0ks-dev
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mirrorbox.rule=Host(`mirrorbox.iv0ks.dev`)'
      - 'traefik.http.routers.mirrorbox.entrypoints=websecure'
      - 'traefik.http.routers.mirrorbox.tls=true'
      - 'traefik.http.routers.mirrorbox.tls.certresolver=namecheap'
      - 'traefik.http.services.mirrorbox.loadbalancer.server.port=3000'

# Persistent volumes.
volumes:
  postgres-data:

# This network must be created once with `docker network create iv0ks-dev` before bringing the stack up.
networks:
  iv0ks-dev:
    external: true
